name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential \
            cargo \
            rustc \
            dpkg-dev \
            debhelper \
            file \
            xz-utils

      - name: Build Debian package
        run: |
          set -euo pipefail
          dpkg-buildpackage -uc -us -b

      - name: Move debs to current directory
        run: |
          set -euo pipefail
          mv ../lyxcat_*.deb .

      - name: List debs
        run: ls -la *.deb

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: lyxcat_*.deb
          asset_name: lyxcat_${{ github.ref_name }}_amd64.deb
          asset_content_type: application/vnd.debian.binary-package
