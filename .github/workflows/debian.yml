name: Debian Package Build

on:
  push:
    branches:
      - github
    tags:
      - 'v*'
  pull_request:
    branches:
      - github

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential \
            cargo \
            rustc \
            dpkg-dev \
            debhelper \
            file \
            xz-utils

      - name: Build Debian package
        run: |
          set -euo pipefail
          dpkg-buildpackage -uc -us -b

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyxcat-deb
          path: ../lyxcat_*.deb
